<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Lord 实时观察</title>
<style>
  :root { --bg:#0f1115; --panel:#171a21; --line:#2a2f3a; --text:#d7dae0; --dim:#8a91a0; --acc:#4ea1ff; --ok:#3fb970; --bad:#e5644e; --warn:#d9a23c; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:13px/1.55 -apple-system,"PingFang SC","Helvetica Neue",sans-serif; }
  header { padding:10px 14px; border-bottom:1px solid var(--line); display:flex; gap:8px; align-items:baseline; flex-wrap:wrap; }
  header h1 { font-size:15px; margin:0; }
  header .sub { color:var(--dim); font-size:12px; }
  #conn { font-size:12px; }
  #conn.on { color:var(--ok); } #conn.off { color:var(--bad); }
  main { display:flex; flex-direction:column; }
  #tasks { padding:8px 10px; border-bottom:1px solid var(--line); display:flex; flex-direction:column; gap:6px; }
  .task-card { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:8px 10px; cursor:pointer; }
  .task-card.active { border-color:var(--acc); }
  .task-card .tid { font-weight:600; word-break:break-all; }
  .task-card .meta { color:var(--dim); font-size:12px; margin-top:2px; word-break:break-all; }
  .badge { display:inline-block; padding:0 6px; border-radius:9px; font-size:11px; border:1px solid var(--line); margin-left:6px; }
  .badge.running { color:var(--acc); border-color:var(--acc); }
  .badge.succeeded { color:var(--ok); border-color:var(--ok); }
  .badge.failed, .badge.needs_decision { color:var(--bad); border-color:var(--bad); }
  #resume { padding:8px 10px; border-bottom:1px solid var(--line); font-size:12px; color:var(--dim); word-break:break-all; }
  #resume code { color:var(--text); background:var(--panel); padding:1px 5px; border-radius:4px; user-select:all; }
  #timeline { padding:8px 10px; overflow-y:auto; }
  .ev { border-left:2px solid var(--line); padding:2px 8px; margin:3px 0; word-break:break-word; white-space:pre-wrap; }
  .ev .tag { font-size:11px; color:var(--dim); margin-right:6px; }
  .ev.assistant { border-color:var(--acc); }
  .ev.tool { border-color:var(--warn); color:var(--dim); }
  .ev.tool .head { color:var(--text); }
  .ev.err { border-color:var(--bad); color:var(--bad); }
  .ev.final { border-color:var(--ok); }
  .ev.journal { border-color:#6a5acd; color:var(--dim); font-size:12px; }
  .ev.notice { border-color:var(--warn); color:var(--warn); font-size:12px; }
  .ev.marker { color:var(--dim); font-size:11px; }
  #omitted { color:var(--dim); font-size:12px; padding:2px 10px; }
  .mono { font-family:ui-monospace,Menlo,monospace; }
</style>
</head>
<body>
<header>
  <h1>Agent Lord 实时观察</h1>
  <span class="sub">只读投影 · 不影响任务运行</span>
  <span id="conn" class="off">未连接</span>
</header>
<main>
  <section id="tasks"></section>
  <section id="resume"></section>
  <div id="omitted"></div>
  <section id="timeline"></section>
</main>
<script>
(function () {
  const qs = new URLSearchParams(location.search);
  const token = qs.get("token") || "";
  let currentTask = qs.get("task") || null;
  let source = null;
  const seen = new Set();          // seq 去重（重连补发时防重复渲染）
  const $ = (id) => document.getElementById(id);

  function api(path) { return path + (path.includes("?") ? "&" : "?") + "token=" + encodeURIComponent(token); }
  function esc(s) { const d = document.createElement("div"); d.textContent = s == null ? "" : String(s); return d.innerHTML; }

  function setConn(ok, label) {
    const el = $("conn"); el.className = ok ? "on" : "off"; el.textContent = label;
  }

  function renderTasks(tasks) {
    const box = $("tasks"); box.innerHTML = "";
    tasks.forEach((t) => {
      const card = document.createElement("div");
      card.className = "task-card" + (t.task_id === currentTask ? " active" : "");
      const st = t.status || "?";
      const cls = /running/.test(st) ? "running" : (st.split(" ")[0]);
      let meta = "";
      if (t.available) {
        meta = `${esc(t.provider)} · ${esc(t.model || "默认模型")} · 操作数 ${t.operations}`;
        if (t.last_activity_unix) meta += " · 最近活动 " + new Date(t.last_activity_unix * 1000).toLocaleTimeString();
        meta += `<br>${esc(t.capability)}`;
      } else {
        meta = "任务记录不可读: " + esc(t.error);
      }
      card.innerHTML = `<div class="tid">${esc(t.task_id)}<span class="badge ${esc(cls)}">${esc(st)}</span></div><div class="meta">${meta}</div>`;
      card.onclick = () => { currentTask = t.task_id; openTask(); };
      box.appendChild(card);
    });
  }

  function renderResume(t) {
    if (!t || !t.resume) { $("resume").innerHTML = ""; return; }
    const r = t.resume;
    let html = `<b>原生会话</b> session: <span class="mono">${esc(r.session_id || "未知")}</span> · 工作目录: <span class="mono">${esc(r.workdir || "")}</span><br>`;
    if (r.command) html += `续聊命令: <code class="mono">${esc(r.command)}</code><br>`;
    if (r.note) html += esc(r.note);
    html += r.resumable ? "" : "";
    $("resume").innerHTML = html;
  }

  function evNode(e) {
    const div = document.createElement("div");
    const ts = e.ts ? new Date(e.ts).toLocaleTimeString() : (e.ts_ms ? new Date(e.ts_ms).toLocaleTimeString() : "");
    const tag = `<span class="tag">${esc(ts)}</span>`;
    switch (e.kind) {
      case "assistant_delta":
      case "assistant_text":
        div.className = "ev assistant"; div.innerHTML = tag + esc(e.text); break;
      case "tool_start":
        div.className = "ev tool"; div.innerHTML = tag + `<span class="head">▶ ${esc(e.tool)}</span> ${esc(e.summary || "")}`; break;
      case "tool_update":
        div.className = "ev tool marker"; div.innerHTML = tag + `… ${esc(e.tool)} 进行中`; break;
      case "tool_end": {
        const mark = e.ok === false ? "✖" : "✔";
        div.className = "ev tool"; div.innerHTML = tag + `<span class="head">${mark} ${esc(e.tool)}</span>` +
          (e.exit_code != null ? ` exit=${esc(e.exit_code)}` : "") +
          (e.result ? `<br>${esc(e.result)}` : ""); break; }
      case "error":
        div.className = "ev err"; div.innerHTML = tag + "错误: " + esc(e.message); break;
      case "final":
        div.className = "ev final"; div.innerHTML = tag + (e.ok ? "✔ 终态：成功" : "✖ 终态：失败") +
          (e.duration_ms != null ? ` · 用时 ${Math.round(e.duration_ms / 1000)}s` : "") +
          (e.summary ? `<br>${esc(e.summary)}` : ""); break;
      case "lifecycle":
        div.className = "ev marker"; div.innerHTML = tag + "· " + esc(e.label || e.name); break;
      case "journal":
        div.className = "ev journal"; div.innerHTML = tag + `[控制平面] ${esc(e.label || e.name)}` + (e.detail ? " " + esc(e.detail) : ""); break;
      case "notice":
        div.className = "ev notice"; div.innerHTML = tag + "[观察器] " + esc(e.text); break;
      case "provider_event":
        div.className = "ev marker"; div.innerHTML = tag + "(" + esc(e.name) + ")"; break;
      default:
        div.className = "ev marker"; div.innerHTML = tag + "(" + esc(e.kind) + ")";
    }
    return div;
  }

  function appendEvents(events) {
    const tl = $("timeline");
    const nearBottom = tl.scrollHeight - tl.scrollTop - tl.clientHeight < 80;
    let lastAssist = null;
    events.forEach((e) => {
      if (e.seq != null) {
        if (seen.has(e.seq)) return;   // 拒绝重复渲染
        seen.add(e.seq);
      }
      // 合并连续的 assistant 增量，避免每个 delta 一行
      if (e.kind === "assistant_delta" && lastAssist) { lastAssist.innerHTML += esc(e.text); return; }
      const node = evNode(e);
      tl.appendChild(node);
      lastAssist = (e.kind === "assistant_delta" || e.kind === "assistant_text") ? node : null;
    });
    if (nearBottom) tl.scrollTop = tl.scrollHeight;
  }

  function openTask() {
    if (source) { source.close(); source = null; }
    seen.clear();
    $("timeline").innerHTML = ""; $("omitted").textContent = "";
    if (!currentTask) return;
    refreshOverview();
    connect(null);
  }

  function connect(cursor) {
    const url = api(`/api/task/${encodeURIComponent(currentTask)}/stream` + (cursor ? `?cursor=${encodeURIComponent(cursor)}` : ""));
    source = new EventSource(url);
    setConn(false, "连接中…");
    source.onopen = () => setConn(true, "实时连接");
    source.addEventListener("batch", (msg) => {
      const p = JSON.parse(msg.data);
      if (p.omitted_earlier) $("omitted").textContent = `（更早的 ${p.omitted_earlier} 条事件未展示，仅保留最近窗口）`;
      if (p.task) renderResume(p.task);
      appendEvents(p.events || []);
      setConn(true, "实时连接");
    });
    source.addEventListener("heartbeat", (msg) => {
      const p = JSON.parse(msg.data);
      if (p.task) renderResume(p.task);
      setConn(true, "实时连接（心跳）");
    });
    source.addEventListener("snapshot-required", () => {
      setConn(false, "游标过期，重新快照…");
      source.close(); seen.clear(); $("timeline").innerHTML = "";
      connect(null);   // 无 cursor -> 服务端重新给快照
    });
    source.onerror = () => setConn(false, "连接断开，浏览器将自动重连");
  }

  function refreshOverview() {
    fetch(api("/api/overview")).then((r) => r.json()).then((d) => {
      renderTasks(d.tasks || []);
      if (!currentTask && d.tasks && d.tasks.length) { currentTask = d.tasks[0].task_id; openTask(); }
      else if (currentTask) { const t = (d.tasks || []).find((x) => x.task_id === currentTask); if (t) renderResume(t); }
    }).catch(() => setConn(false, "总览获取失败"));
  }

  if (!token) {
    document.body.innerHTML = '<p style="padding:20px">缺少访问令牌：请使用启动时输出的完整 URL（含 ?token=）。</p>';
    return;
  }
  refreshOverview();
  setInterval(refreshOverview, 10000);
  if (!currentTask) { /* refreshOverview 会自动选第一个任务 */ } else { openTask(); }
})();
</script>
</body>
</html>
